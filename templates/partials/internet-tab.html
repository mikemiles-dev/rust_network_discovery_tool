  <!-- Internet Tab Content -->
  <div id="internet-tab" class="tab-content">
    <div class="dns-table-container">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="color: var(--text-primary); font-size: 1.25rem; margin: 0;">Internet Destinations</h2>
        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <input type="text" id="internetSearch" placeholder="Search..."
                 oninput="filterInternetTable(this.value)"
                 style="padding: 0.5rem 0.75rem; background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(71, 85, 105, 0.5); border-radius: 0.5rem; color: var(--text-primary); font-size: 0.85rem; width: 250px;">
          <button onclick="refreshInternetTable()" style="padding: 0.5rem 0.75rem; background: rgba(59, 130, 246, 0.2); border: 1px solid rgba(59, 130, 246, 0.4); color: #60a5fa; border-radius: 0.5rem; cursor: pointer; font-size: 0.85rem;">
            Refresh
          </button>
        </div>
      </div>
      <table class="dns-table" id="internet-table">
        <thead>
          <tr>
            <th style="cursor: pointer;" onclick="sortInternetTable('hostname')">Domain <span id="sort-hostname"></span></th>
            <th style="cursor: pointer; text-align: right;" onclick="sortInternetTable('packets')">Packets <span id="sort-packets"></span></th>
            <th style="cursor: pointer;" onclick="sortInternetTable('first_seen')">First Seen <span id="sort-first_seen"></span></th>
            <th style="cursor: pointer;" onclick="sortInternetTable('last_seen')">Last Seen <span id="sort-last_seen"></span></th>
          </tr>
        </thead>
        <tbody id="internet-table-body">
          <tr>
            <td colspan="4" style="text-align: center; color: var(--text-secondary); padding: 2rem;">
              Loading internet destinations...
            </td>
          </tr>
        </tbody>
      </table>
      <!-- Internet Pagination -->
      <div class="pagination-container" id="internet-pagination">
        <div class="pagination-info">
          <span id="internet-page-info">Showing 0-0 of 0</span>
          <select class="page-size-select" id="internet-page-size" onchange="App.Internet.changePageSize(this.value)">
            <option value="50" selected>50 per page</option>
            <option value="100">100 per page</option>
            <option value="250">250 per page</option>
            <option value="all">Show all</option>
          </select>
        </div>
        <div class="pagination-controls" id="internet-page-controls">
          <!-- Page buttons will be generated by JavaScript -->
        </div>
      </div>
    </div>
  </div><!-- End Internet Tab -->
