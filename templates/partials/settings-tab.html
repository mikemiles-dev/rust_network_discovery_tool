  <div id="settings-tab" class="tab-content">
    <div class="scanner-container" style="max-width: 800px; margin: 0 auto; padding: 2rem;">
      <h2 style="color: var(--text-primary); margin-bottom: 1.5rem; font-size: 1.5rem;">Settings</h2>

      <div class="settings-section" style="background: var(--card-bg); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem;">
        <h3 style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.1rem;">Appearance</h3>

        <div class="setting-item" style="margin-bottom: 0.5rem;">
          <label style="display: block; color: var(--text-secondary); margin-bottom: 0.75rem; font-size: 0.875rem;">
            Theme
          </label>
          <div style="display: flex; gap: 0.5rem;">
            <button id="theme-light-btn"
                    style="padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s;">
              ☀️ Light
            </button>
            <button id="theme-dark-btn"
                    style="padding: 0.5rem 1rem; border-radius: 0.375rem; font-size: 0.875rem; cursor: pointer; transition: all 0.2s;">
              🌙 Dark
            </button>
          </div>
        </div>
      </div>

      <div class="settings-section" style="background: var(--card-bg); border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 1rem;">
        <h3 style="color: var(--text-primary); margin-bottom: 1rem; font-size: 1.1rem;">Timing Settings</h3>

        <div class="setting-item" style="margin-bottom: 1.5rem;">
          <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.875rem;">
            Cleanup Interval (seconds)
          </label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="number" id="setting-cleanup-interval"
                   style="width: 120px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-secondary); color: var(--text-primary);"
                   min="10" max="3600" value="30">
            <span style="color: var(--text-secondary); font-size: 0.75rem;">
              How often to run cleanup tasks (merge duplicates, etc.)
            </span>
          </div>
        </div>

        <div class="setting-item" style="margin-bottom: 1.5rem;">
          <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.875rem;">
            Data Retention (days)
          </label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="number" id="setting-data-retention"
                   style="width: 120px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-secondary); color: var(--text-primary);"
                   min="1" max="365" value="7">
            <span style="color: var(--text-secondary); font-size: 0.75rem;">
              How long to keep communication records
            </span>
          </div>
        </div>

        <div class="setting-item" style="margin-bottom: 1.5rem;">
          <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.875rem;">
            Active Threshold (seconds)
          </label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="number" id="setting-active-threshold"
                   style="width: 120px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-secondary); color: var(--text-primary);"
                   min="10" max="3600" value="120">
            <span style="color: var(--text-secondary); font-size: 0.75rem;">
              Endpoints with activity within this time are shown as "Active" (green indicator)
            </span>
          </div>
        </div>

        <div class="setting-item" style="margin-bottom: 1.5rem;">
          <label style="display: block; color: var(--text-secondary); margin-bottom: 0.5rem; font-size: 0.875rem;">
            Auto Scan Interval (minutes)
          </label>
          <div style="display: flex; align-items: center; gap: 1rem;">
            <input type="number" id="setting-auto-scan-interval"
                   style="width: 120px; padding: 0.5rem; border: 1px solid var(--border-color); border-radius: 0.25rem; background: var(--bg-secondary); color: var(--text-primary);"
                   min="0" max="1440" value="5">
            <span style="color: var(--text-secondary); font-size: 0.75rem;">
              Automatically run a full network scan at this interval (0 to disable)
            </span>
          </div>
        </div>
      </div>

      <div style="display: flex; gap: 1rem;">
        <button onclick="saveSettings()"
                style="padding: 0.75rem 1.5rem; background: var(--accent-primary); color: white; border: none; border-radius: 0.25rem; cursor: pointer; font-weight: 500;">
          Save Settings
        </button>
        <button onclick="loadSettings()"
                style="padding: 0.75rem 1.5rem; background: var(--card-bg); color: var(--text-primary); border: 1px solid var(--border-color); border-radius: 0.25rem; cursor: pointer;">
          Reset
        </button>
      </div>

      <div id="settings-status" style="margin-top: 1rem; padding: 0.75rem; border-radius: 0.25rem; display: none;"></div>
    </div>
  </div><!-- End Settings Tab -->
