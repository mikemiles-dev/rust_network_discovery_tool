  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --bg-input: rgba(15, 23, 42, 0.6);
      --card-bg: #1e293b;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-primary: #3b82f6;
      --accent-secondary: #8b5cf6;
      --accent-success: #10b981;
      --border-color: #334155;
      --border-subtle: rgba(71, 85, 105, 0.5);
      --shadow: rgba(0, 0, 0, 0.3);
    }

    /* Light theme */
    [data-theme="light"] {
      --bg-primary: #f8fafc;
      --bg-secondary: #e2e8f0;
      --bg-tertiary: #cbd5e1;
      --bg-input: #ffffff;
      --card-bg: #f1f5f9;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --accent-primary: #2563eb;
      --accent-secondary: #7c3aed;
      --accent-success: #059669;
      --border-color: #cbd5e1;
      --border-subtle: rgba(100, 116, 139, 0.3);
      --shadow: rgba(0, 0, 0, 0.1);
    }

    /* Theme selection buttons - override global button styles */
    #theme-light-btn, #theme-dark-btn {
      background: var(--bg-tertiary) !important;
      border: 2px solid var(--border-color) !important;
      color: var(--text-primary) !important;
    }

    #theme-light-btn:hover, #theme-dark-btn:hover {
      background: var(--bg-secondary) !important;
      border-color: var(--accent-primary) !important;
      transform: none !important;
      box-shadow: none !important;
    }

    #theme-light-btn.active, #theme-dark-btn.active {
      border-color: var(--accent-primary) !important;
      background: var(--accent-primary) !important;
      color: white !important;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* Header */
    header {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      padding: 0.5rem 2rem 0 2rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      box-shadow: 0 2px 8px var(--shadow);
      z-index: 100;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      padding-bottom: 0.375rem;
    }

    .logo a {
      text-decoration: none;
      background: inherit;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .controls {
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .control-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    select {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 150px;
    }

    select:hover {
      border-color: var(--accent-primary);
      background: var(--bg-secondary);
    }

    select:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    /* Main Layout */
    .container {
      height: calc(100vh - 42px);
      padding: 1rem 1rem 0 1rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Filter Bar */
    .filter-bar {
      background: var(--bg-secondary);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.75rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .filter-bar .quick-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .filter-bar .filter-row {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .filter-bar .filter-label {
      font-size: 0.75rem;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .filter-bar .filter-checkboxes {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }

    .filter-bar .filter-label {
      position: relative;
    }

    .filter-bar .filter-only-btn {
      display: none;
      padding: 0 0.2rem;
      margin-left: 0.15rem;
      font-size: 0.55rem;
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 0.2rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      line-height: 1;
      vertical-align: middle;
    }

    .filter-bar .filter-label:hover .filter-only-btn {
      display: inline-block;
    }

    .filter-bar .filter-only-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      color: #fff;
    }

    .search-bar {
      background: var(--bg-secondary);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .search-bar .search-input-wrapper {
      flex: 1;
      position: relative;
    }

    .search-bar .search-input {
      width: 100%;
      padding: 0.5rem 0.75rem 0.5rem 2rem;
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      color: var(--text-primary);
      font-size: 0.85rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .search-bar .search-input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.2);
    }

    .search-bar .search-input::placeholder {
      color: var(--text-secondary);
    }

    .search-bar .search-icon {
      position: absolute;
      left: 0.65rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-secondary);
      font-size: 0.85rem;
      pointer-events: none;
    }

    .search-bar .refresh-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card {
      background: var(--bg-tertiary);
      border-radius: 0.75rem;
      padding: 1rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 16px var(--shadow);
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      margin-bottom: 0.75rem;
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.5rem 0.75rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      transition: all 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    button {
      background: var(--accent-primary);
      color: white;
      border: none;
      padding: 0.5rem 1rem;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #2563eb;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
    }

    button.secondary:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-primary);
      box-shadow: none;
    }

    .list-box {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 0.375rem;
    }

    .list-item {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border-color);
      font-family: 'Monaco', 'Courier New', monospace;
      position: relative;
      padding-right: 4rem;
    }

    .endpoint-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: calc(100% - 5rem);
      display: inline-block;
    }

    .endpoint-vendor {
      position: absolute;
      right: 5rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.625rem;
      color: #60a5fa;
      background: rgba(59, 130, 246, 0.15);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      white-space: nowrap;
      max-width: 5rem;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .endpoint-bytes {
      position: absolute;
      right: 0.5rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.625rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      white-space: nowrap;
    }

    .list-item:hover {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .list-item:active {
      transform: translateY(0);
    }

    .list-item.selected {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .section {
      margin-bottom: 0.75rem;
    }

    .section:last-child {
      margin-bottom: 0;
    }

    /* Graph Container */
    #graph-container {
      flex: 1;
      display: flex;
      background: var(--bg-primary);
      min-height: 0; /* Important: allows flex item to shrink below content size */
    }

    /* Endpoints Table View */
    .endpoints-table-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
      min-height: 0;
    }

    .endpoints-table-wrapper {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .endpoints-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    .endpoints-table th {
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid var(--border-color);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .endpoints-table th:hover {
      background: rgba(59, 130, 246, 0.15);
    }

    .endpoints-table th .sort-icon {
      margin-left: 0.5rem;
      opacity: 0.5;
      font-size: 0.75rem;
    }

    .endpoints-table th.sorted-asc .sort-icon::after {
      content: '▲';
      opacity: 1;
    }

    .endpoints-table th.sorted-desc .sort-icon::after {
      content: '▼';
      opacity: 1;
    }

    .endpoints-table th:not(.sorted-asc):not(.sorted-desc) .sort-icon::after {
      content: '⇅';
    }

    .endpoints-table td {
      padding: 0.625rem 1rem;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
      vertical-align: middle;
    }

    .endpoints-table tbody tr {
      transition: background 0.15s;
      cursor: pointer;
    }

    .endpoints-table tbody tr:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .endpoints-table tbody tr.selected {
      background: rgba(59, 130, 246, 0.2);
    }

    /* Actions column */
    .actions-header {
      width: 60px;
      text-align: center;
    }

    .actions-cell {
      text-align: center;
      padding: 0.25rem !important;
    }

    .ping-btn {
      background: transparent;
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 0.25rem;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      font-size: 0.7rem;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .ping-btn:hover:not(:disabled) {
      background: rgba(59, 130, 246, 0.1);
      border-color: #3b82f6;
      color: var(--text-primary);
    }

    .ping-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .ping-btn.pinging {
      opacity: 0.6;
    }

    .ping-btn .ping-icon {
      font-size: 0.75rem;
    }

    .ping-btn .ping-status {
      font-size: 0.65rem;
      min-width: 1.5rem;
    }

    .ping-btn.success {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.15);
    }

    .ping-btn.success .ping-status {
      color: #22c55e;
    }

    .ping-btn.failed {
      border-color: #ef4444;
      background: rgba(239, 68, 68, 0.15);
    }

    .ping-btn.failed .ping-status {
      color: #ef4444;
    }

    /* Endpoint type color coding */
    .endpoint-row[data-endpoint-type="gaming"] {
      border-left: 3px solid #ef4444;
      background: rgba(239, 68, 68, 0.08);
    }
    .endpoint-row[data-endpoint-type="tv"] {
      border-left: 3px solid #a855f7;
      background: rgba(168, 85, 247, 0.08);
    }
    .endpoint-row[data-endpoint-type="phone"] {
      border-left: 3px solid #22c55e;
      background: rgba(34, 197, 94, 0.08);
    }
    .endpoint-row[data-endpoint-type="printer"] {
      border-left: 3px solid #f59e0b;
      background: rgba(245, 158, 11, 0.08);
    }
    .endpoint-row[data-endpoint-type="gateway"] {
      border-left: 3px solid #3b82f6;
      background: rgba(59, 130, 246, 0.08);
    }
    .endpoint-row[data-endpoint-type="internet"] {
      border-left: 3px solid #6b7280;
      background: rgba(107, 114, 128, 0.05);
    }
    .endpoint-row[data-endpoint-type="local"] {
      border-left: 3px solid #06b6d4;
      background: rgba(6, 182, 212, 0.08);
    }
    .endpoint-row[data-endpoint-type="virtualization"] {
      border-left: 3px solid #8b5cf6;
      background: rgba(139, 92, 246, 0.08);
    }
    .endpoint-row[data-endpoint-type="soundbar"] {
      border-left: 3px solid #ec4899;
      background: rgba(236, 72, 153, 0.08);
    }
    .endpoint-row[data-endpoint-type="appliance"] {
      border-left: 3px solid #d97706;
      background: rgba(217, 119, 6, 0.08);
    }
    .endpoint-row[data-endpoint-type="other"] {
      border-left: 3px solid #64748b;
      background: rgba(100, 116, 139, 0.05);
    }

    /* Keep selected state visible over type colors */
    .endpoint-row.selected {
      background: rgba(59, 130, 246, 0.25) !important;
    }

    .endpoint-type-cell {
      font-size: 1.25rem;
      text-align: center;
      width: 3rem;
    }

    .status-header {
      width: 1.5rem;
      min-width: 1.5rem;
      max-width: 1.5rem;
      padding: 0.5rem !important;
    }

    .status-cell {
      width: 1.5rem;
      min-width: 1.5rem;
      max-width: 1.5rem;
      padding: 0.5rem !important;
      text-align: center;
    }

    .status-indicator {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      transition: background-color 0.3s ease;
    }

    .status-indicator.online {
      background-color: #22c55e;
      box-shadow: 0 0 6px rgba(34, 197, 94, 0.6);
    }

    .status-indicator.offline {
      background-color: #6b7280;
      opacity: 0.5;
    }

    .status-indicator.unreachable {
      background-color: #ef4444;
      box-shadow: 0 0 6px rgba(239, 68, 68, 0.6);
    }

    .endpoint-name-cell {
      font-weight: 500;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .ip-list, .mac-list {
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 0.75rem;
    }

    .ip-list span, .mac-list span {
      display: inline-block;
      background: rgba(51, 65, 85, 0.5);
      padding: 0.125rem 0.375rem;
      border-radius: 0.25rem;
      margin: 0.125rem;
    }

    .bandwidth-cell {
      font-family: 'Monaco', 'Courier New', monospace;
      text-align: right;
      white-space: nowrap;
    }

    .vendor-cell {
      color: var(--text-secondary);
      font-size: 0.75rem;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-cell {
      color: var(--accent-secondary);
      font-size: 0.75rem;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Zoom Controls - Hidden for table view */
    .zoom-controls {
      position: absolute;
      bottom: 2.5rem;
      right: 445px;
      display: flex;
      flex-direction: row;
      gap: 0.25rem;
      z-index: 10;
    }

    .zoom-btn {
      width: 32px;
      height: 32px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 1.25rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .zoom-btn:hover {
      background: var(--bg-tertiary);
      border-color: var(--accent-primary);
    }

    .zoom-btn:active {
      transform: scale(0.95);
    }

    /* Stats Badge */
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 0.375rem;
      margin-top: 0.5rem;
    }

    .stat-badge {
      background: var(--bg-input);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.6875rem;
      color: var(--text-secondary);
    }

    .stat-badge.stat-link {
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .stat-badge.stat-link:hover {
      background: rgba(139, 92, 246, 0.3);
      color: var(--text-primary);
    }

    .stat-number {
      color: var(--accent-primary);
      font-weight: 600;
    }

    /* Device Type Dropdown */
    .device-type-selector {
      position: relative;
      display: inline-block;
    }

    .device-type-btn {
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(59, 130, 246, 0.4);
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.75rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
    }

    .device-type-btn:hover {
      background: rgba(59, 130, 246, 0.3);
      border-color: rgba(59, 130, 246, 0.6);
    }

    .device-type-btn .dropdown-arrow {
      font-size: 0.5rem;
      opacity: 0.7;
    }

    .device-type-btn.manual-override {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
    }

    .device-type-btn.manual-override:hover {
      background: rgba(139, 92, 246, 0.3);
      border-color: rgba(139, 92, 246, 0.6);
    }

    .device-type-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      margin-top: 0.25rem;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      box-shadow: 0 4px 12px var(--shadow);
      z-index: 1000;
      min-width: 160px;
      display: none;
      overflow: hidden;
    }

    .device-type-dropdown.open {
      display: block;
    }

    .device-type-option {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .device-type-option:hover {
      background: rgba(59, 130, 246, 0.1);
      color: var(--text-primary);
    }

    .device-type-option.selected {
      background: rgba(59, 130, 246, 0.2);
      color: var(--text-primary);
    }

    .device-type-option.auto-option {
      border-bottom: 1px solid var(--border-color);
      color: var(--accent-primary);
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: var(--accent-success);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .pulse.stopped {
      background: #ef4444;
      animation: none;
      opacity: 1;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .scan-indicator-pulse {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1s infinite;
    }

    .stop-refresh-btn {
      padding: 0.25rem 0.5rem;
      background: transparent;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      transition: all 0.2s ease;
    }

    .stop-refresh-btn:hover {
      transform: scale(1.05);
    }

    .stop-refresh-btn:active {
      transform: scale(0.95);
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 0.375rem;
    }

    .tab-btn {
      padding: 0.375rem 0.625rem;
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      border-radius: 0.25rem 0.25rem 0 0;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-bottom: -1px;
    }

    .tab-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      border-color: rgba(139, 92, 246, 0.4);
      color: var(--text-primary);
    }

    .tab-btn.active {
      background: var(--bg-primary);
      border-color: var(--border-color);
      border-bottom-color: var(--bg-primary);
      color: var(--text-primary);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Notification badge */
    .notification-badge {
      background: #ef4444;
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0.1rem 0.4rem;
      border-radius: 9999px;
      margin-left: 0.3rem;
      vertical-align: top;
      min-width: 1.1rem;
      text-align: center;
      display: inline-block;
    }

    /* Notification items */
    .notification-item {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.75rem 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .notification-item:hover {
      border-color: var(--accent-primary);
    }

    .notification-icon {
      font-size: 1.2rem;
      flex-shrink: 0;
      margin-top: 0.1rem;
    }

    .notification-body {
      flex: 1;
      min-width: 0;
    }

    .notification-title {
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 500;
    }

    a.notification-link {
      color: var(--accent-primary);
      text-decoration: none;
      cursor: pointer;
    }

    a.notification-link:hover {
      text-decoration: underline;
    }

    .notification-details {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin-top: 0.15rem;
    }

    .notification-time {
      color: var(--text-secondary);
      font-size: 0.7rem;
      margin-top: 0.25rem;
    }

    .notification-dismiss {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1rem;
      padding: 0.2rem;
      flex-shrink: 0;
      line-height: 1;
    }

    .notification-dismiss:hover {
      color: var(--text-primary);
    }

    .notification-empty {
      text-align: center;
      color: var(--text-secondary);
      padding: 3rem 1rem;
      font-size: 0.9rem;
    }

    .notifications-pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      padding: 0.75rem 0;
      flex-wrap: wrap;
    }

    .notifications-pagination .notif-page-btn {
      padding: 0.3rem 0.6rem;
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      border-radius: 0.25rem;
      cursor: pointer;
      font-size: 0.8rem;
      min-width: 2rem;
      text-align: center;
    }

    .notifications-pagination .notif-page-btn:hover:not(:disabled) {
      border-color: var(--accent-primary);
    }

    .notifications-pagination .notif-page-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    .notifications-pagination .notif-page-btn:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .notifications-pagination .notif-page-info {
      color: var(--text-secondary);
      font-size: 0.8rem;
      margin: 0 0.5rem;
    }

    .notifications-pagination .notif-page-ellipsis {
      color: var(--text-secondary);
      font-size: 0.8rem;
      padding: 0 0.2rem;
    }

    /* DNS Table */
    .dns-table-container {
      padding: 1rem;
      overflow: auto;
      height: calc(100vh - 73px);
    }

    .dns-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.75rem;
    }

    .dns-table th,
    .dns-table td {
      padding: 0.5rem 0.75rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .dns-table th {
      background: var(--bg-secondary);
      color: var(--text-secondary);
      font-weight: 600;
      position: sticky;
      top: 0;
    }

    .dns-table tr:hover {
      background: rgba(139, 92, 246, 0.1);
    }

    .dns-table td {
      color: var(--text-primary);
      font-family: 'Monaco', 'Courier New', monospace;
    }

    /* Pagination styling */
    .pagination-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1rem;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      font-size: 0.8rem;
      position: sticky;
      bottom: 0;
    }

    .pagination-info {
      color: var(--text-secondary);
    }

    .pagination-controls {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .pagination-btn {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.375rem 0.625rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.75rem;
      transition: all 0.15s;
      min-width: 2rem;
      text-align: center;
    }

    .pagination-btn:hover:not(:disabled) {
      background: var(--bg-primary);
      border-color: var(--accent-primary);
    }

    .pagination-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .pagination-btn.active {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      color: white;
    }

    .pagination-ellipsis {
      color: var(--text-secondary);
      padding: 0 0.25rem;
    }

    .page-size-select {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      padding: 0.375rem 0.5rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      cursor: pointer;
      margin-left: 0.5rem;
    }

    .page-size-select:hover {
      border-color: var(--accent-primary);
    }

    /* Scrollbar styling */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--bg-tertiary);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--border-color);
    }

    /* Empty state */
    .empty-state {
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-style: italic;
      padding: 0.375rem 0.5rem;
    }

    /* Range slider styling */
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      border: 2px solid rgba(15, 23, 42, 0.8);
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent-color);
      cursor: pointer;
      border: 2px solid rgba(15, 23, 42, 0.8);
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #10b981;
    }

    input[type="range"]::-moz-range-thumb:hover {
      background: #10b981;
    }

    /* Endpoint Details Panel */
    .protocols-overlay {
      width: 400px;
      flex-shrink: 0;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border-color);
      margin-left: 1rem;
      padding: 0.5rem 1rem 1rem 1rem;
      overflow-y: auto;
      box-sizing: border-box;
    }

    .overlay-header {
      font-size: 0.875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
      padding-bottom: 0.5rem;
      margin-bottom: 0.75rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .overlay-header:not(:first-child) {
      margin-top: 0.75rem;
    }

    .clear-filter-btn, .clear-port-filter-btn {
      background: var(--accent-secondary);
      color: white;
      border: none;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      font-size: 0.625rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .clear-filter-btn:hover, .clear-port-filter-btn:hover {
      background: #7c3aed;
      transform: translateY(-1px);
    }

    .overlay-content {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .protocol-badge {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      padding: 0.375rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid var(--border-color);
      white-space: nowrap;
    }

    .protocol-badge:hover {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      transform: translateY(-1px);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
    }

    .protocol-badge:active {
      transform: translateY(0);
    }

    .protocol-badge.selected {
      background: var(--accent-primary);
      color: white;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .protocol-badge.dimmed {
      opacity: 0.4;
    }

    .protocol-dropdown {
      position: fixed;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      min-width: 200px;
      max-width: 300px;
      max-height: 300px;
      overflow-y: auto;
      z-index: 1000;
      display: none;
    }

    .protocol-dropdown.show {
      display: block;
    }

    .protocol-dropdown-header {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border-color);
      background: var(--bg-primary);
      position: sticky;
      top: 0;
    }

    .protocol-dropdown-item {
      padding: 0.5rem 0.75rem;
      font-size: 0.8125rem;
      color: var(--text-primary);
      cursor: pointer;
      transition: background 0.15s;
      border-bottom: 1px solid rgba(51, 65, 85, 0.3);
    }

    .protocol-dropdown-item:last-child {
      border-bottom: none;
    }

    .protocol-dropdown-item:hover {
      background: var(--accent-primary);
      color: white;
    }

    .protocol-dropdown-empty {
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      font-style: italic;
    }

    .protocol-dropdown-loading {
      padding: 0.75rem;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
    }

    /* Merge Endpoint Modal */
    .merge-modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .merge-modal-overlay.show {
      display: flex;
    }

    .merge-modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 0.75rem;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      width: 90%;
      max-width: 450px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }

    .merge-modal-header {
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .merge-modal-header h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.25rem;
    }

    .merge-modal-header p {
      font-size: 0.8rem;
      color: var(--text-secondary);
    }

    .merge-modal-search {
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
    }

    .merge-modal-search input {
      width: 100%;
      padding: 0.625rem 0.875rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 0.875rem;
    }

    .merge-modal-search input:focus {
      outline: none;
      border-color: var(--accent-primary);
    }

    .merge-modal-search input::placeholder {
      color: var(--text-secondary);
    }

    .merge-modal-list {
      flex: 1;
      overflow-y: auto;
      min-height: 200px;
      max-height: 350px;
    }

    .merge-modal-item {
      padding: 0.75rem 1.25rem;
      cursor: pointer;
      border-bottom: 1px solid rgba(51, 65, 85, 0.2);
      transition: background 0.15s;
    }

    .merge-modal-item:hover {
      background: rgba(59, 130, 246, 0.1);
    }

    .merge-modal-item.selected {
      background: rgba(59, 130, 246, 0.2);
      border-left: 3px solid var(--accent-primary);
    }

    .merge-modal-item-name {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-primary);
    }

    .merge-modal-item-details {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 0.125rem;
    }

    .merge-modal-empty {
      padding: 2rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.875rem;
    }

    .merge-modal-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 0.75rem;
      justify-content: flex-end;
    }

    .merge-modal-btn {
      padding: 0.625rem 1.25rem;
      border-radius: 0.375rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .merge-modal-btn-cancel {
      background: var(--bg-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .merge-modal-btn-cancel:hover {
      background: var(--bg-primary);
    }

    .merge-modal-btn-confirm {
      background: #2563eb;
      border: none;
      color: white;
    }

    .merge-modal-btn-confirm:hover {
      background: #1d4ed8;
    }

    .merge-modal-btn-confirm:disabled {
      background: #64748b;
      cursor: not-allowed;
    }

    .overlay-hostnames {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      margin-bottom: 0.75rem;
    }

    .listbox {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 0.5rem;
      max-height: 150px;
      overflow-y: auto;
      margin-bottom: 0.75rem;
    }

    .listbox::-webkit-scrollbar {
      width: 6px;
    }

    .listbox::-webkit-scrollbar-track {
      background: var(--bg-tertiary);
      border-radius: 3px;
    }

    .listbox::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.5);
      border-radius: 3px;
    }

    .listbox::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }

    .listbox-item {
      padding: 0.5rem 0.75rem;
      font-size: 0.75rem;
      color: var(--text-primary);
      border-bottom: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: background 0.15s;
      font-family: 'Monaco', 'Courier New', monospace;
    }

    .listbox-item:last-child {
      border-bottom: none;
    }

    .listbox-item:hover {
      background: rgba(59, 130, 246, 0.15);
    }

    .listbox-item.selected {
      background: rgba(59, 130, 246, 0.25);
    }

    .listbox .empty-state {
      padding: 1rem;
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .hostname-item {
      background: transparent;
      color: var(--text-primary);
      padding: 0.25rem 0 0.25rem 0.75rem;
      font-size: 0.75rem;
      font-weight: 400;
      cursor: default;
      font-family: 'Monaco', 'Courier New', monospace;
      user-select: text;
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      line-height: 1.4;
    }

    .probe-btn {
      margin-left: 0.5rem;
      padding: 0.1rem 0.4rem;
      font-size: 0.65rem;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 0.2rem;
      cursor: pointer;
      font-family: inherit;
    }

    .probe-btn:hover {
      background: var(--accent-hover);
    }

    .probe-btn:disabled {
      background: var(--text-secondary);
      cursor: not-allowed;
    }

    /* Detail Tabs (inside right panel) */
    .detail-tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.5rem;
    }

    .detail-tab {
      padding: 0.25rem 0.5rem;
      background: transparent;
      border: 1px solid rgba(100, 116, 139, 0.3);
      border-radius: 0.25rem;
      color: var(--text-secondary);
      font-size: 0.65rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .detail-tab:hover {
      color: var(--text-primary);
    }

    .detail-tab.active {
      color: white;
    }

    /* Color-coded tabs */
    .detail-tab[data-tab="details-tab-content"] {
      border-left: 2px solid #3b82f6;
    }
    .detail-tab[data-tab="details-tab-content"]:hover {
      border-color: #3b82f6;
    }
    .detail-tab[data-tab="details-tab-content"].active {
      background: rgba(59, 130, 246, 0.25);
      border-color: #3b82f6;
    }

    .detail-tab[data-tab="network-tab-content"] {
      border-left: 2px solid #22c55e;
    }
    .detail-tab[data-tab="network-tab-content"]:hover {
      border-color: #22c55e;
    }
    .detail-tab[data-tab="network-tab-content"].active {
      background: rgba(34, 197, 94, 0.25);
      border-color: #22c55e;
    }

    .detail-tab[data-tab="control-tab-content"] {
      border-left: 2px solid #f59e0b;
    }
    .detail-tab[data-tab="control-tab-content"]:hover {
      border-color: #f59e0b;
    }
    .detail-tab[data-tab="control-tab-content"].active {
      background: rgba(245, 158, 11, 0.25);
      border-color: #f59e0b;
    }

    .detail-tab-content {
      display: none;
    }

    .detail-tab-content.active {
      display: block;
    }

    /* Remote Control Styles */
    .remote-section {
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid rgba(51, 65, 85, 0.4);
    }

    .remote-section:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }

    .remote-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    .remote-dpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 0.25rem;
      max-width: 150px;
      margin: 0 auto;
    }

    .remote-btn {
      padding: 0.5rem;
      background: rgba(51, 65, 85, 0.6);
      border: 1px solid var(--border-color);
      border-radius: 0.375rem;
      color: var(--text-primary);
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
    }

    .remote-btn:hover {
      background: var(--accent-primary);
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }

    .remote-btn:active {
      transform: translateY(0);
      background: #2563eb;
    }

    .remote-btn.dpad-up {
      grid-column: 2;
      grid-row: 1;
    }

    .remote-btn.dpad-left {
      grid-column: 1;
      grid-row: 2;
    }

    .remote-btn.dpad-ok {
      grid-column: 2;
      grid-row: 2;
      background: var(--accent-primary);
      font-weight: 600;
    }

    .remote-btn.dpad-right {
      grid-column: 3;
      grid-row: 2;
    }

    .remote-btn.dpad-down {
      grid-column: 2;
      grid-row: 3;
    }

    .remote-row {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
    }

    .remote-btn.power-btn {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
      width: 100%;
    }

    .remote-btn.power-btn:hover {
      background: #ef4444;
      border-color: #ef4444;
      color: white;
    }

    .apps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      max-height: 200px;
      overflow-y: auto;
    }

    .app-btn {
